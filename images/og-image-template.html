<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; }
.card {
  width: 1200px;
  height: 630px;
  background: linear-gradient(155deg, #5e6e52 0%, #4A5840 40%, #3d4a35 100%);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 70px 80px 60px;
  position: relative;
}
.tag {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.headline {
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 80px;
  font-weight: 400;
  line-height: 1.05;
  color: #FFFFFF;
  letter-spacing: -0.01em;
  margin-top: -20px;
}
.subtitle {
  font-family: 'DM Sans', sans-serif;
  font-size: 22px;
  font-weight: 400;
  color: rgba(255,255,255,0.55);
  line-height: 1.5;
  margin-top: -10px;
}
.bottom {
  display: flex;
  align-items: center;
  gap: 24px;
}
.line {
  width: 60px;
  height: 1px;
  background: rgba(255,255,255,0.2);
}
.url {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}
</style>
</head>
<body>
<div class="card">
  <div class="tag">Canopy Environments</div>
  <div class="headline">Designed. Delivered.<br>Done.</div>
  <div class="subtitle">Plant and floral programs for NYC's<br>premium commercial spaces.</div>
  <div class="bottom">
    <div class="line"></div>
    <div class="url">canopyenvironments.com</div>
  </div>
</div>
</body>
</html>
